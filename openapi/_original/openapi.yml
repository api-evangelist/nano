openapi: 3.0.3
info:
  title: Nano RPC API
  description: >
    The Nano RPC API is a JSON-RPC HTTP interface for interacting with the Nano
    network. Nano is a feeless, instant digital currency using a block-lattice
    architecture where each account maintains its own blockchain. The RPC API
    supports account queries, block operations, wallet management, node
    diagnostics, and unit conversions. All requests are POST with a JSON body
    containing an "action" field identifying the RPC command.
  version: 1.0.0
  contact:
    name: Nano Foundation
    url: https://nano.org/en/developers
    email: integrations@nano.org
  license:
    name: BSD-2-Clause
    url: https://opensource.org/licenses/BSD-2-Clause
  termsOfService: https://nano.org/terms-of-use
externalDocs:
  description: Nano RPC Protocol Documentation
  url: https://docs.nano.org/commands/rpc-protocol/
servers:
  - url: http://localhost:7076
    description: Local Nano node (default RPC port)
paths:

  # ── Account Operations ───────────────────────────────────────────────────────

  /account_balance:
    post:
      operationId: account_balance
      summary: Get account balance
      description: Returns the balance for an account in raw units.
      tags: [Accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, account]
              properties:
                action:
                  type: string
                  enum: [account_balance]
                account:
                  type: string
                  description: Nano account address (nano_ prefix)
                include_only_confirmed:
                  type: boolean
                  description: Only include confirmed blocks in balance
            example:
              action: account_balance
              account: "nano_3t6k35gi95xu6tergt6p69ck76ogmitsa8mnijtpxm9fkcm736xtoncuohr3"
      responses:
        '200':
          description: Account balance in raw units
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountBalanceResponse'

  /account_block_count:
    post:
      operationId: account_block_count
      summary: Get account block count
      description: Returns the number of blocks in the account's blockchain.
      tags: [Accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, account]
              properties:
                action:
                  type: string
                  enum: [account_block_count]
                account:
                  type: string
            example:
              action: account_block_count
              account: "nano_3t6k35gi95xu6tergt6p69ck76ogmitsa8mnijtpxm9fkcm736xtoncuohr3"
      responses:
        '200':
          description: Block count for the account
          content:
            application/json:
              schema:
                type: object
                properties:
                  block_count:
                    type: string

  /account_get:
    post:
      operationId: account_get
      summary: Get account from public key
      description: Returns the account address corresponding to a public key.
      tags: [Accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, key]
              properties:
                action:
                  type: string
                  enum: [account_get]
                key:
                  type: string
                  description: Public key (hex)
      responses:
        '200':
          description: Account address
          content:
            application/json:
              schema:
                type: object
                properties:
                  account:
                    type: string

  /account_history:
    post:
      operationId: account_history
      summary: Get account history
      description: Returns a list of blocks for an account with transaction details.
      tags: [Accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, account, count]
              properties:
                action:
                  type: string
                  enum: [account_history]
                account:
                  type: string
                count:
                  type: integer
                  description: Number of blocks to return
                raw:
                  type: boolean
                head:
                  type: string
                  description: Block hash to start from
                offset:
                  type: integer
                reverse:
                  type: boolean
                include_linked_account:
                  type: boolean
                account_filter:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Account history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountHistoryResponse'

  /account_info:
    post:
      operationId: account_info
      summary: Get account info
      description: Returns detailed information about an account's blockchain state.
      tags: [Accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, account]
              properties:
                action:
                  type: string
                  enum: [account_info]
                account:
                  type: string
                representative:
                  type: boolean
                weight:
                  type: boolean
                receivable:
                  type: boolean
                include_confirmed:
                  type: boolean
            example:
              action: account_info
              account: "nano_3t6k35gi95xu6tergt6p69ck76ogmitsa8mnijtpxm9fkcm736xtoncuohr3"
              representative: true
              weight: true
      responses:
        '200':
          description: Account information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountInfoResponse'

  /account_key:
    post:
      operationId: account_key
      summary: Get public key for account
      description: Returns the public key corresponding to a Nano account address.
      tags: [Accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, account]
              properties:
                action:
                  type: string
                  enum: [account_key]
                account:
                  type: string
      responses:
        '200':
          description: Public key
          content:
            application/json:
              schema:
                type: object
                properties:
                  key:
                    type: string

  /account_representative:
    post:
      operationId: account_representative
      summary: Get account representative
      description: Returns the representative for an account.
      tags: [Accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, account]
              properties:
                action:
                  type: string
                  enum: [account_representative]
                account:
                  type: string
      responses:
        '200':
          description: Account representative
          content:
            application/json:
              schema:
                type: object
                properties:
                  representative:
                    type: string

  /account_weight:
    post:
      operationId: account_weight
      summary: Get account voting weight
      description: Returns the voting weight for an account.
      tags: [Accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, account]
              properties:
                action:
                  type: string
                  enum: [account_weight]
                account:
                  type: string
      responses:
        '200':
          description: Voting weight
          content:
            application/json:
              schema:
                type: object
                properties:
                  weight:
                    type: string

  /accounts_balances:
    post:
      operationId: accounts_balances
      summary: Get balances for multiple accounts
      description: Returns balances for a list of Nano accounts.
      tags: [Accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, accounts]
              properties:
                action:
                  type: string
                  enum: [accounts_balances]
                accounts:
                  type: array
                  items:
                    type: string
                include_only_confirmed:
                  type: boolean
      responses:
        '200':
          description: Balances for each account
          content:
            application/json:
              schema:
                type: object
                properties:
                  balances:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/AccountBalanceResponse'
                  errors:
                    type: object
                    additionalProperties:
                      type: string

  /accounts_frontiers:
    post:
      operationId: accounts_frontiers
      summary: Get frontiers for multiple accounts
      description: Returns the frontier (head block hash) for each account.
      tags: [Accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, accounts]
              properties:
                action:
                  type: string
                  enum: [accounts_frontiers]
                accounts:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Frontier hashes
          content:
            application/json:
              schema:
                type: object
                properties:
                  frontiers:
                    type: object
                    additionalProperties:
                      type: string
                  errors:
                    type: object
                    additionalProperties:
                      type: string

  /accounts_receivable:
    post:
      operationId: accounts_receivable
      summary: Get receivable blocks for multiple accounts
      description: Returns pending/receivable blocks for a list of accounts.
      tags: [Accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, accounts, count]
              properties:
                action:
                  type: string
                  enum: [accounts_receivable]
                accounts:
                  type: array
                  items:
                    type: string
                count:
                  type: integer
                threshold:
                  type: string
                source:
                  type: boolean
                include_active:
                  type: boolean
                sorting:
                  type: boolean
                include_only_confirmed:
                  type: boolean
      responses:
        '200':
          description: Receivable blocks per account
          content:
            application/json:
              schema:
                type: object
                properties:
                  blocks:
                    type: object
                    additionalProperties:
                      type: object

  /accounts_representatives:
    post:
      operationId: accounts_representatives
      summary: Get representatives for multiple accounts
      description: Returns the representative for each of the given accounts.
      tags: [Accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, accounts]
              properties:
                action:
                  type: string
                  enum: [accounts_representatives]
                accounts:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Representatives per account
          content:
            application/json:
              schema:
                type: object
                properties:
                  representatives:
                    type: object
                    additionalProperties:
                      type: string
                  errors:
                    type: object
                    additionalProperties:
                      type: string

  /available_supply:
    post:
      operationId: available_supply
      summary: Get available supply
      description: Returns the amount of Nano available in circulation.
      tags: [Ledger]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [available_supply]
      responses:
        '200':
          description: Available supply in raw units
          content:
            application/json:
              schema:
                type: object
                properties:
                  available:
                    type: string

  # ── Block Operations ─────────────────────────────────────────────────────────

  /block_account:
    post:
      operationId: block_account
      summary: Get account for block
      description: Returns the account that owns the given block hash.
      tags: [Blocks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, hash]
              properties:
                action:
                  type: string
                  enum: [block_account]
                hash:
                  type: string
      responses:
        '200':
          description: Account for the block
          content:
            application/json:
              schema:
                type: object
                properties:
                  account:
                    type: string

  /block_confirm:
    post:
      operationId: block_confirm
      summary: Request block confirmation
      description: Requests active confirmation of a block by the network.
      tags: [Blocks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, hash]
              properties:
                action:
                  type: string
                  enum: [block_confirm]
                hash:
                  type: string
      responses:
        '200':
          description: Confirmation started
          content:
            application/json:
              schema:
                type: object
                properties:
                  started:
                    type: string

  /block_count:
    post:
      operationId: block_count
      summary: Get total block count
      description: Returns the total number of blocks in the ledger.
      tags: [Blocks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [block_count]
                include_cemented:
                  type: boolean
      responses:
        '200':
          description: Block counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: string
                  unchecked:
                    type: string
                  cemented:
                    type: string

  /block_create:
    post:
      operationId: block_create
      summary: Create a block
      description: Creates a new state block for the Nano network.
      tags: [Blocks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, json_block, type, balance, representative, link, previous]
              properties:
                action:
                  type: string
                  enum: [block_create]
                json_block:
                  type: string
                type:
                  type: string
                  enum: [state]
                balance:
                  type: string
                key:
                  type: string
                wallet:
                  type: string
                account:
                  type: string
                representative:
                  type: string
                link:
                  type: string
                previous:
                  type: string
                work:
                  type: string
                version:
                  type: string
                difficulty:
                  type: string
      responses:
        '200':
          description: Created block
          content:
            application/json:
              schema:
                type: object
                properties:
                  hash:
                    type: string
                  block:
                    type: object
                  difficulty:
                    type: string

  /block_hash:
    post:
      operationId: block_hash
      summary: Compute block hash
      description: Returns the hash of a given block without publishing it.
      tags: [Blocks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, json_block, block]
              properties:
                action:
                  type: string
                  enum: [block_hash]
                json_block:
                  type: string
                block:
                  type: object
      responses:
        '200':
          description: Block hash
          content:
            application/json:
              schema:
                type: object
                properties:
                  hash:
                    type: string

  /block_info:
    post:
      operationId: block_info
      summary: Get block info
      description: Returns detailed information about a specific block hash.
      tags: [Blocks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, hash, json_block]
              properties:
                action:
                  type: string
                  enum: [block_info]
                hash:
                  type: string
                json_block:
                  type: string
                include_linked_account:
                  type: boolean
      responses:
        '200':
          description: Block information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockInfoResponse'

  /blocks:
    post:
      operationId: blocks
      summary: Get multiple blocks
      description: Returns block contents for a list of block hashes.
      tags: [Blocks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, hashes, json_block]
              properties:
                action:
                  type: string
                  enum: [blocks]
                hashes:
                  type: array
                  items:
                    type: string
                json_block:
                  type: string
      responses:
        '200':
          description: Block contents
          content:
            application/json:
              schema:
                type: object
                properties:
                  blocks:
                    type: object
                    additionalProperties:
                      type: object

  /blocks_info:
    post:
      operationId: blocks_info
      summary: Get detailed info for multiple blocks
      description: Returns detailed information for a list of block hashes.
      tags: [Blocks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, hashes, json_block]
              properties:
                action:
                  type: string
                  enum: [blocks_info]
                hashes:
                  type: array
                  items:
                    type: string
                json_block:
                  type: string
                pending:
                  type: boolean
                source:
                  type: boolean
                receive_hash:
                  type: boolean
                include_not_found:
                  type: boolean
                include_linked_account:
                  type: boolean
      responses:
        '200':
          description: Block details
          content:
            application/json:
              schema:
                type: object
                properties:
                  blocks:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/BlockInfoResponse'
                  blocks_not_found:
                    type: array
                    items:
                      type: string

  /chain:
    post:
      operationId: chain
      summary: Get chain of blocks
      description: Returns a list of block hashes starting from the given block, traversing backwards.
      tags: [Blocks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, block, count]
              properties:
                action:
                  type: string
                  enum: [chain]
                block:
                  type: string
                count:
                  type: integer
                offset:
                  type: integer
                reverse:
                  type: boolean
      responses:
        '200':
          description: Chain of block hashes
          content:
            application/json:
              schema:
                type: object
                properties:
                  blocks:
                    type: array
                    items:
                      type: string

  /process:
    post:
      operationId: process
      summary: Process a block
      description: Publishes a signed block to the Nano network.
      tags: [Blocks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, block, json_block, subtype]
              properties:
                action:
                  type: string
                  enum: [process]
                block:
                  oneOf:
                    - type: object
                    - type: string
                json_block:
                  type: string
                subtype:
                  type: string
                  enum: [send, receive, open, change, epoch]
                force:
                  type: boolean
                async:
                  type: boolean
      responses:
        '200':
          description: Block hash after processing
          content:
            application/json:
              schema:
                type: object
                properties:
                  hash:
                    type: string

  /republish:
    post:
      operationId: republish
      summary: Republish blocks
      description: Rebroadcasts blocks starting from the given hash to network peers.
      tags: [Blocks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, hash]
              properties:
                action:
                  type: string
                  enum: [republish]
                hash:
                  type: string
                count:
                  type: integer
      responses:
        '200':
          description: Republished block hashes
          content:
            application/json:
              schema:
                type: object
                properties:
                  blocks:
                    type: array
                    items:
                      type: string

  /sign:
    post:
      operationId: sign
      summary: Sign a block
      description: Signs a block with a provided private key or wallet.
      tags: [Blocks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, json_block, block]
              properties:
                action:
                  type: string
                  enum: [sign]
                json_block:
                  type: string
                block:
                  type: object
                key:
                  type: string
                wallet:
                  type: string
                account:
                  type: string
      responses:
        '200':
          description: Signed block
          content:
            application/json:
              schema:
                type: object
                properties:
                  signature:
                    type: string
                  block:
                    type: object

  /successors:
    post:
      operationId: successors
      summary: Get successor blocks
      description: Returns successive block hashes forward from the given block.
      tags: [Blocks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, block, count]
              properties:
                action:
                  type: string
                  enum: [successors]
                block:
                  type: string
                count:
                  type: integer
      responses:
        '200':
          description: Successor block hashes
          content:
            application/json:
              schema:
                type: object
                properties:
                  blocks:
                    type: array
                    items:
                      type: string

  # ── Work Operations ──────────────────────────────────────────────────────────

  /work_cancel:
    post:
      operationId: work_cancel
      summary: Cancel work generation
      description: Cancels pending work generation for a given hash.
      tags: [Work]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, hash]
              properties:
                action:
                  type: string
                  enum: [work_cancel]
                hash:
                  type: string
      responses:
        '200':
          description: Cancellation acknowledged
          content:
            application/json:
              schema:
                type: object

  /work_generate:
    post:
      operationId: work_generate
      summary: Generate proof-of-work
      description: Generates proof-of-work for a given block hash.
      tags: [Work]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, hash]
              properties:
                action:
                  type: string
                  enum: [work_generate]
                hash:
                  type: string
                difficulty:
                  type: string
                multiplier:
                  type: string
                account:
                  type: string
      responses:
        '200':
          description: Generated work value
          content:
            application/json:
              schema:
                type: object
                properties:
                  work:
                    type: string
                  difficulty:
                    type: string
                  multiplier:
                    type: string

  /work_validate:
    post:
      operationId: work_validate
      summary: Validate proof-of-work
      description: Validates that a given work value satisfies difficulty for a hash.
      tags: [Work]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, work, hash]
              properties:
                action:
                  type: string
                  enum: [work_validate]
                work:
                  type: string
                hash:
                  type: string
                difficulty:
                  type: string
                multiplier:
                  type: string
      responses:
        '200':
          description: Work validation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  difficulty:
                    type: string
                  multiplier:
                    type: string

  # ── Node & Network Operations ────────────────────────────────────────────────

  /bootstrap:
    post:
      operationId: bootstrap
      summary: Bootstrap from peer
      description: Initiates a bootstrap sync from the specified peer node.
      tags: [Node]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, address, port]
              properties:
                action:
                  type: string
                  enum: [bootstrap]
                address:
                  type: string
                port:
                  type: string
                bypass_frontier_confirmation:
                  type: boolean
                id:
                  type: string
      responses:
        '200':
          description: Bootstrap started
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: string

  /bootstrap_any:
    post:
      operationId: bootstrap_any
      summary: Bootstrap from any peer
      description: Initiates a bootstrap sync from any available peer.
      tags: [Node]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [bootstrap_any]
                force:
                  type: boolean
                id:
                  type: string
                account:
                  type: string
      responses:
        '200':
          description: Bootstrap started
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: string

  /bootstrap_lazy:
    post:
      operationId: bootstrap_lazy
      summary: Lazy bootstrap from hash
      description: Initiates lazy (hash-based) bootstrap starting from a specific block.
      tags: [Node]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, hash]
              properties:
                action:
                  type: string
                  enum: [bootstrap_lazy]
                hash:
                  type: string
                force:
                  type: boolean
                id:
                  type: string
      responses:
        '200':
          description: Bootstrap status
          content:
            application/json:
              schema:
                type: object
                properties:
                  started:
                    type: string
