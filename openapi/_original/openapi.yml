              schema:
                type: object

  # ── Unit Conversion ──────────────────────────────────────────────────────────

  /nano_to_raw:
    post:
      operationId: nano_to_raw
      summary: Convert Nano to raw units
      description: Converts an amount from Nano denomination to raw units (10^30 raw = 1 Nano).
      tags: [Unit Conversion]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, amount]
              properties:
                action:
                  type: string
                  enum: [nano_to_raw]
                amount:
                  type: string
            example:
              action: nano_to_raw
              amount: "1"
      responses:
        '200':
          description: Equivalent amount in raw units
          content:
            application/json:
              schema:
                type: object
                properties:
                  amount:
                    type: string
                    example: "1000000000000000000000000000000"

  /raw_to_nano:
    post:
      operationId: raw_to_nano
      summary: Convert raw units to Nano
      description: Converts an amount from raw units to Nano denomination.
      tags: [Unit Conversion]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, amount]
              properties:
                action:
                  type: string
                  enum: [raw_to_nano]
                amount:
                  type: string
                  description: Amount in raw units
            example:
              action: raw_to_nano
              amount: "1000000000000000000000000000000"
      responses:
        '200':
          description: Equivalent amount in Nano
          content:
            application/json:
              schema:
                type: object
                properties:
                  amount:
                    type: string
                    example: "1"

components:
  schemas:
    AccountBalanceResponse:
      type: object
      properties:
        balance:
          type: string
          description: Confirmed balance in raw units
        pending:
          type: string
          description: Pending (receivable) balance in raw units (deprecated alias)
        receivable:
          type: string
          description: Pending (receivable) balance in raw units

    AccountHistoryResponse:
      type: object
      properties:
        account:
          type: string
        history:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum: [send, receive, change, epoch]
              account:
                type: string
              amount:
                type: string
              hash:
                type: string
              height:
                type: string
              local_timestamp:
                type: string
        previous:
          type: string

    AccountInfoResponse:
      type: object
      properties:
        frontier:
          type: string
          description: Hash of the head block
        open_block:
          type: string
          description: Hash of the account open block
        representative_block:
          type: string
        balance:
          type: string
          description: Confirmed balance in raw units
        modified_timestamp:
          type: string
        block_count:
          type: string
        representative:
          type: string
        weight:
          type: string
        receivable:
          type: string

    BlockInfoResponse:
      type: object
      properties:
        block_account:
          type: string
        amount:
          type: string
        balance:
          type: string
        height:
          type: string
        local_timestamp:
          type: string
        confirmed:
          type: string
        contents:
          type: object
          properties:
            type:
              type: string
            account:
              type: string
            previous:
              type: string
            representative:
              type: string
            balance:
              type: string
            link:
              type: string
            link_as_account:
              type: string
            signature:
              type: string
            work:
              type: string
        subtype:
          type: string
          enum: [send, receive, open, change, epoch]

    KeyPairResponse:
      type: object
      properties:
        private:
          type: string
          description: Private key (hex)
        public:
          type: string
          description: Public key (hex)
        account:
          type: string
          description: Nano account address

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Human-readable error message

tags:
  - name: Accounts
    description: Account balance, history, representative, and frontier queries
  - name: Blocks
    description: Block creation, processing, signing, and querying operations
  - name: Ledger
    description: Ledger-level queries for supply, frontiers, and account data
  - name: Node
    description: Node diagnostics, bootstrapping, peers, and confirmation management
  - name: Work
    description: Proof-of-work generation, validation, and caching
  - name: Keys
    description: Cryptographic key generation and derivation
  - name: Wallets
    description: Local wallet management for development and testing
  - name: Unit Conversion
    description: Conversion between Nano and raw unit denominations
