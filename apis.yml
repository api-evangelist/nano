    meta:
      - key: rpcActions
        value: account_create, account_list, account_move, account_remove, account_representative_set, accounts_create, password_change, password_enter, password_valid, receive, receive_minimum, receive_minimum_set, search_receivable, search_receivable_all, send, wallet_add, wallet_add_watch, wallet_balances, wallet_change_seed, wallet_contains, wallet_create, wallet_destroy, wallet_export, wallet_frontiers, wallet_history, wallet_info, wallet_ledger, wallet_lock, wallet_locked, wallet_receivable, wallet_representative, wallet_representative_set, wallet_republish, wallet_work_get, work_get, work_set
