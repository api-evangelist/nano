name: Nano
description: Nano is a feeless, instant digital currency using a block-lattice architecture. It provides a JSON-RPC HTTP API for querying accounts, retrieving block information, managing wallets, processing transactions, and interacting with the Nano network. Each account maintains its own blockchain, enabling fast and lightweight consensus without mining.
image: https://nano.org/favicon.ico
url: https://raw.githubusercontent.com/api-evangelist/nano/refs/heads/main/apis.yml
created: '2026-06-14'
modified: '2026-06-14'
specificationVersion: '0.19'
tags:
  - Cryptocurrency
  - Payments
  - Blockchain
  - Feeless
  - Instant Payments
  - Digital Currency
apis:
  - name: Nano RPC API - Account Operations
    description: JSON-RPC endpoints for querying Nano account balances, history, representatives, voting weight, and frontier block information. Supports both single and bulk account queries.
    image: https://nano.org/favicon.ico
    humanURL: https://docs.nano.org/commands/rpc-protocol/
    baseURL: http://localhost:7076
    tags:
      - Accounts
      - Balances
      - History
      - Representatives
    properties:
      - type: Documentation
        url: https://docs.nano.org/commands/rpc-protocol/
      - type: OpenAPI
        url: https://raw.githubusercontent.com/api-evangelist/nano/refs/heads/main/openapi.yml
    contact:
      - FN: Nano Foundation
        email: integrations@nano.org
        url: https://nano.org/en/developers
    meta:
      - key: rpcActions
        value: account_balance, account_block_count, account_get, account_history, account_info, account_key, account_representative, account_weight, accounts_balances, accounts_frontiers, accounts_receivable, accounts_representatives, available_supply
  - name: Nano RPC API - Block Operations
    description: JSON-RPC endpoints for creating, querying, publishing, and confirming blocks on the Nano network. Includes block hash computation, chain traversal, and work generation for proof-of-work.
    image: https://nano.org/favicon.ico
    humanURL: https://docs.nano.org/commands/rpc-protocol/
    baseURL: http://localhost:7076
    tags:
      - Blocks
      - Transactions
      - Work Generation
      - Ledger
    properties:
      - type: Documentation
        url: https://docs.nano.org/commands/rpc-protocol/
      - type: OpenAPI
        url: https://raw.githubusercontent.com/api-evangelist/nano/refs/heads/main/openapi.yml
    contact:
      - FN: Nano Foundation
        email: integrations@nano.org
        url: https://nano.org/en/developers
    meta:
      - key: rpcActions
        value: block_account, block_confirm, block_count, block_create, block_hash, block_info, blocks, blocks_info, chain, process, republish, sign, successors, work_cancel, work_generate, work_validate
  - name: Nano RPC API - Node Operations
    description: JSON-RPC endpoints for managing and monitoring a Nano node, including bootstrap operations, peer management, telemetry, statistics, confirmation status, and network diagnostics.
    image: https://nano.org/favicon.ico
    humanURL: https://docs.nano.org/commands/rpc-protocol/
    baseURL: http://localhost:7076
    tags:
