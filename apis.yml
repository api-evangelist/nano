    properties:
      - type: Documentation
        url: https://docs.nano.org/commands/rpc-protocol/
      - type: OpenAPI
        url: https://raw.githubusercontent.com/api-evangelist/nano/refs/heads/main/openapi.yml
    contact:
      - FN: Nano Foundation
        email: integrations@nano.org
        url: https://nano.org/en/developers
    meta:
      - key: rpcActions
        value: bootstrap, bootstrap_any, bootstrap_lazy, bootstrap_status, confirmation_active, confirmation_history, confirmation_info, confirmation_quorum, delegators, delegators_count, election_statistics, frontier_count, frontiers, keepalive, ledger, node_id, peers, populate_backlog, receivable, receivable_exists, representatives, representatives_online, stats, telemetry, uptime, validate_account_number, version
  - name: Nano RPC API - Wallet Operations
    description: JSON-RPC endpoints for managing local Nano wallets, including creating and managing accounts, sending and receiving funds, locking wallets, and exporting wallet data. Intended for development and testing environments.
    image: https://nano.org/favicon.ico
    humanURL: https://docs.nano.org/commands/rpc-protocol/
